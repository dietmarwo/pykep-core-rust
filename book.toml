[book]
title = "pykep-rust"
authors = ["Dietmar Wolz"]
description = "Native Rust astrodynamics: API guides, conventions, validation, and Python migration"
language = "en"
src = "docs"

[build]
build-dir = "target/book"
create-missing = false

[output.html]
