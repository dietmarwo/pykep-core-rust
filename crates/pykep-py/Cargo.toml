[package]
name = "pykep-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 bindings for the pykep-rust Python distribution."
publish = false

[lints]
workspace = true

[lib]
name = "_pykep_rust"
crate-type = ["cdylib"]
doc = false

[dependencies]
numpy = "0.29"
pykep-core = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module"] }
