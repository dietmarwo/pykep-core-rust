[package]
name = "pykep-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust astrodynamics core for the pykep-rust port."
publish = false

[features]
default = ["vsop2013"]
vsop2013 = []

[lib]
name = "pykep_core"

[lints]
workspace = true

[dependencies]
differential-equations = { version = "0.6.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0.151"

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "elements"
harness = false

[[bench]]
name = "propagation"
harness = false

[[bench]]
name = "mission"
harness = false

[[bench]]
name = "integration"
harness = false
