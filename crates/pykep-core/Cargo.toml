[package]
name = "pykep-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native Rust astrodynamics core for the pykep-rust port."
readme = "README.md"
documentation = "https://docs.rs/pykep-core"
keywords = ["astrodynamics", "orbital-mechanics", "spaceflight", "kepler"]
categories = ["aerospace", "mathematics", "science"]
publish = ["crates-io"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["vsop2013"]
vsop2013 = []

[lib]
name = "pykep_core"

[lints]
workspace = true

[dependencies]
differential-equations = { version = "0.6.1", default-features = false }
rayon = "1.12"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0.151"

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "elements"
harness = false

[[bench]]
name = "propagation"
harness = false

[[bench]]
name = "mission"
harness = false

[[bench]]
name = "integration"
harness = false

[[bench]]
name = "dynamics"
harness = false

[[bench]]
name = "legs"
harness = false
