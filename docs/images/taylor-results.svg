<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Taylor speed-up and accuracy by tolerance</title>
  <desc id="desc">Wall-time speed-up of Taylor over DOP853 for one revolution: 1e−9 0.87 times, 1e−12 1.18 times, 1e−14 1.61 times, epsilon 2.16 times. Maximum state error on a log scale: Taylor is smaller than DOP853 at every tolerance.</desc>
  <style>
    .axis { stroke:#304b5f; stroke-width:2 }
    .grid { stroke:#d9e2e8; stroke-width:1 }
    .bar { fill:#26886b }
    .slow { fill:#c87822 }
    .dop { fill:#557a95; stroke:#557a95 }
    .taylor { fill:#26886b; stroke:#26886b }
    .series { fill:none; stroke-width:2 }
    .text { font-family:sans-serif; font-size:14px; fill:#263b49 }
    .small { font-family:sans-serif; font-size:12px; fill:#263b49 }
    .halo { paint-order:stroke; stroke:white; stroke-width:4px; stroke-linejoin:round }
    .heading { font-family:sans-serif; font-size:18px; font-weight:600; fill:#172b3a }
    .value { font-family:sans-serif; font-size:14px; font-weight:600; fill:#172b3a; text-anchor:middle }
  </style>
  <rect width="960" height="470" fill="white"/>
  <text class="heading" x="30" y="32">One revolution: wall-time speed-up (DOP853 time / Taylor time)</text>
  <line class="axis" x1="80" y1="195" x2="900" y2="195"/>
  <line class="grid" x1="80" y1="120" x2="900" y2="120"/>
  <line class="grid" x1="80" y1="45" x2="900" y2="45"/>
  <text class="text" x="46" y="200">0×</text>
  <text class="text" x="46" y="125">1×</text>
  <text class="text" x="46" y="50">2×</text>
  <rect class="slow" x="125" y="130" width="110" height="65"/>
  <text class="value" x="180" y="122">0.87×</text>
  <rect class="bar" x="335" y="106" width="110" height="89"/>
  <text class="value" x="390" y="98">1.18×</text>
  <rect class="bar" x="545" y="74" width="110" height="121"/>
  <text class="value" x="600" y="66">1.61×</text>
  <rect class="bar" x="755" y="33" width="110" height="162"/>
  <text class="value" x="810" y="25">2.16×</text>
  <text class="text" x="180" y="219" text-anchor="middle">1e−9</text>
  <text class="text" x="390" y="219" text-anchor="middle">1e−12</text>
  <text class="text" x="600" y="219" text-anchor="middle">1e−14</text>
  <text class="text" x="810" y="219" text-anchor="middle">epsilon</text>
  <text class="heading" x="30" y="262">Maximum state error (log scale; lower is better)</text>
  <circle class="dop" cx="676" cy="256" r="6"/>
  <text class="text" x="688" y="261">DOP853</text>
  <rect class="taylor" x="770" y="250" width="12" height="12"/>
  <text class="text" x="788" y="261">Taylor</text>
  <line class="grid" x1="80" y1="305.0" x2="900" y2="305.0"/>
  <text class="small" x="74" y="309.0" text-anchor="end">1e−8</text>
  <line class="grid" x1="80" y1="335.0" x2="900" y2="335.0"/>
  <text class="small" x="74" y="339.0" text-anchor="end">1e−10</text>
  <line class="grid" x1="80" y1="365.0" x2="900" y2="365.0"/>
  <text class="small" x="74" y="369.0" text-anchor="end">1e−12</text>
  <line class="grid" x1="80" y1="395.0" x2="900" y2="395.0"/>
  <text class="small" x="74" y="399.0" text-anchor="end">1e−14</text>
  <line class="grid" x1="80" y1="425.0" x2="900" y2="425.0"/>
  <text class="small" x="74" y="429.0" text-anchor="end">1e−16</text>
  <line class="axis" x1="80" y1="425" x2="900" y2="425"/>
  <polyline class="dop series" points="180,296.3 390,335.6 600,361.9 810,381.1" style="fill:none"/>
  <polyline class="taylor series" points="180,334.5 390,376.8 600,382.5 810,408.5" style="fill:none"/>
  <circle class="dop" cx="180" cy="296.3" r="6"/>
  <text class="small halo" x="168" y="300.3" text-anchor="end">3.8e−8</text>
  <rect class="taylor" x="174" y="328.5" width="12" height="12"/>
  <text class="small halo" x="192" y="338.5">1.1e−10</text>
  <circle class="dop" cx="390" cy="335.6" r="6"/>
  <text class="small halo" x="378" y="339.6" text-anchor="end">9.1e−11</text>
  <rect class="taylor" x="384" y="370.8" width="12" height="12"/>
  <text class="small halo" x="402" y="380.8">1.6e−13</text>
  <circle class="dop" cx="600" cy="361.9" r="6"/>
  <text class="small halo" x="588" y="365.9" text-anchor="end">1.6e−12</text>
  <rect class="taylor" x="594" y="376.5" width="12" height="12"/>
  <text class="small halo" x="612" y="386.5">6.8e−14</text>
  <circle class="dop" cx="810" cy="381.1" r="6"/>
  <text class="small halo" x="798" y="385.1" text-anchor="end">8.4e−14</text>
  <rect class="taylor" x="804" y="402.5" width="12" height="12"/>
  <text class="small halo" x="822" y="412.5">1.3e−15</text>
  <text class="text" x="180" y="449" text-anchor="middle">1e−9</text>
  <text class="text" x="390" y="449" text-anchor="middle">1e−12</text>
  <text class="text" x="600" y="449" text-anchor="middle">1e−14</text>
  <text class="text" x="810" y="449" text-anchor="middle">epsilon</text>
  <text class="small" x="490" y="466" text-anchor="middle">requested tolerance</text>
</svg>
