[advisories]
ignore = [
    # Transitive through simba 0.9.1 in the selected integration backend.
    # This is an unmaintained-project notice, not a vulnerability, and the
    # advisory has no safe upgrade as of the Phase 10 decision snapshot.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
