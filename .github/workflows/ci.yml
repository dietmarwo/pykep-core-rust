name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo run -p pykep-examples --bin port-status
      - run: cmp LICENSE crates/pykep-core/LICENSE
        if: runner.os != 'Windows'
      - run: Compare-Object (Get-Content LICENSE) (Get-Content crates/pykep-core/LICENSE) | ForEach-Object { throw $_ }
        if: runner.os == 'Windows'
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.88.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin[patchelf]>=1.7,<2"
      - run: maturin build --release --locked --manifest-path crates/pykep-py/Cargo.toml
      - run: python -m pip install --find-links target/wheels "pykep-rust[test]==0.1.0"
      - run: python -c "import pykep_rust as pk; print(pk.port_status())"
      - run: python -m pytest -q
      - run: python -m mypy
        if: runner.os == 'Linux' && matrix.python-version == '3.12'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit
      - run: cargo deny check

  scaffold-package-guard:
    name: Publication guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! grep -Eq '^publish = false$' crates/pykep-core/Cargo.toml; then
            echo "The scaffold core must remain unpublishable."
            exit 1
          fi
