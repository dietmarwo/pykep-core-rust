# Adapted from Maturin's GitHub template for the explicitly supported
# CPython versions and extended with installed-artifact tests.
name: Build and publish pykep-rust for Python

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pykep-py") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"

  linux:
    name: Build Linux wheels
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build CPython 3.11-3.13 manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --out dist --find-interpreter
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist

  test-linux:
    name: Test Linux wheel on Python ${{ matrix.python-version }}
    needs: linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --no-deps \
            --find-links dist pykep-rust
          EXPECTED_VERSION="$(python scripts/package_version.py)" \
            python scripts/smoke_python_package.py

  windows:
    name: Build and test Windows wheel on Python ${{ matrix.python-version }}
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --locked --out dist -i python
      - name: Install and smoke-test the wheel
        shell: pwsh
        run: |
          python -m pip install numpy
          python -m pip install --no-index --no-deps --find-links dist pykep-rust
          $env:EXPECTED_VERSION = python scripts/package_version.py
          python scripts/smoke_python_package.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64-py${{ matrix.python-version }}
          path: dist

  macos:
    name: Build and test ${{ matrix.platform.target }} macOS wheel on Python ${{ matrix.python-version }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i python
      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --no-deps \
            --find-links dist pykep-rust
          EXPECTED_VERSION="$(python scripts/package_version.py)" \
            python scripts/smoke_python_package.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist

  sdist:
    name: Build and test source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Install and smoke-test the source distribution
        shell: bash
        run: |
          python -m pip install dist/*.tar.gz
          EXPECTED_VERSION="$(python scripts/package_version.py)" \
            python scripts/smoke_python_package.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: "wheels-*/*"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always "wheels-*/*"
