name: Publish pykep-core

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate crates.io package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pykep-core") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Validate formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p pykep-core --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test -p pykep-core --all-features --locked
      - name: Verify package
        run: cargo publish -p pykep-core --dry-run --locked
      - name: Explain first-release bootstrap
        if: vars.CRATES_IO_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "Validation passed. Upload skipped until pykep-core exists,"
          echo "its Trusted Publisher is configured, and the repository"
          echo "variable CRATES_IO_TRUSTED_PUBLISHING is set to true."

  publish:
    name: Publish to crates.io
    if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Determine whether this version already exists
        id: availability
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pykep-core") | .version')"
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --user-agent 'pykep-core-release (https://github.com/dietmarwo/pykep-core-rust)' \
            "https://crates.io/api/v1/crates/pykep-core/$version")"
          case "$status" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "pykep-core $version already exists; skipping its bootstrap duplicate."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response: HTTP $status" >&2
              exit 1
              ;;
          esac
      - name: Obtain a short-lived crates.io token
        if: steps.availability.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish pykep-core
        if: steps.availability.outputs.publish == 'true'
        run: cargo publish -p pykep-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
