[workspace]
resolver = "2"
members = [
    "crates/pykep-core",
    "crates/pykep-py",
    "examples",
    "tools/lambert-optimization-benchmark",
    "tools/release-benchmark",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
authors = ["Dietmar Wolz"]
repository = "https://github.com/dietmarwo/pykep-core-rust"
homepage = "https://dietmarwo.github.io/pykep-core-rust/"

[workspace.dependencies]
pykep-core = { version = "=0.1.2", path = "crates/pykep-core" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
